name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web bundle & sync Capacitor Android
        run: |
          VITE_BASE=/ npm run build
          npx cap sync android

      - name: Build installable Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Relay-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relay-android-apk
          path: Relay-android.apk
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: apk-latest
          name: Relay Android APK (Latest)
          body: 自动构建的 Relay Android 安装包（内置 Meta Muse 界面、原生状态栏与免跨域 OkHttp WebSocket 通道）。直接下载下方 `Relay-android.apk` 安装到手机即可使用。
          files: Relay-android.apk
          make_latest: true
